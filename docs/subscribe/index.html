<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe | GetTradeRadar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0F172A;
            --bg-secondary: #1E293B;
            --accent: #F59E0B;
            --accent-hover: #D97706;
            --accent-light: rgba(245, 158, 11, 0.1);
            --text-primary: #F1F5F9;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --border: #334155;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .nav {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
        }
        .nav a {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent);
            text-decoration: none;
        }

        .content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 60px;
            text-align: center;
            max-width: 560px;
            width: 100%;
        }

        .icon {
            width: 80px;
            height: 80px;
            background: var(--accent-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin: 0 auto 24px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 16px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 32px;
            line-height: 1.7;
        }

        .email-box {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 32px;
        }
        .email-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .email-address {
            color: var(--accent);
            font-weight: 600;
            font-size: 1.1rem;
        }
        .email-address a {
            color: var(--accent);
            text-decoration: none;
        }
        .email-address a:hover { text-decoration: underline; }

        .discount-badge {
            display: inline-block;
            background: rgba(16, 185, 129, 0.15);
            color: #10B981;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid rgba(16, 185, 129, 0.2);
            margin-bottom: 32px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 32px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.2s;
            background: var(--accent);
            color: #000;
            box-shadow: 0 4px 20px rgba(245,158,11,0.3);
        }
        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        .footer-note {
            margin-top: 24px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        @media (max-width: 480px) {
            .card { padding: 40px 24px; }
        }
    </style>
</head>
<body>

    <nav class="nav">
        <a href="../">GetTradeRadar</a>
    </nav>

    <div class="content">
        <div class="card">
            <div class="icon">&#x1F6A7;</div>
            <h1>Payment Processing Coming Soon</h1>
            <p class="subtitle">We are setting up secure payment processing. In the meantime, email us to get early access at a discount.</p>
            <div class="discount-badge">Early access discount available</div>
            <div class="email-box">
                <div class="email-label">Contact Us</div>
                <div class="email-address"><a href="mailto:support@gettraderadar.com">support@gettraderadar.com</a></div>
            </div>
            <a href="mailto:support@gettraderadar.com?subject=Early%20Access%20-%20AI%20Trading%20Signals&body=Hi%2C%20I'm%20interested%20in%20early%20access%20to%20AI%20Trading%20Signals%20at%20a%20discount." class="btn">Email for Early Access</a>
            <p class="footer-note">We typically respond within 24 hours.</p>
        </div>
    </div>

</body>
</html>
