name: Genesis Content Engine

on:
  schedule:
    # MORNING BATCH: 05:00 UTC = 07:00 SAST
    - cron: '0 5 * * *'
    # EVENING BATCH: 12:00 UTC = 14:00 SAST
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'Which batch to run'
        required: false
        default: 'full'
        type: choice
        options:
          - 'full'
          - 'morning'
          - 'evening'
          - 'trends-only'
          - 'post-only'

jobs:
  content-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r genesis/requirements.txt

      - name: Create directories
        run: mkdir -p genesis/output genesis/logs

      - name: Determine batch type
        id: batch
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            HOUR=$(date -u +%H)
            if [ "$HOUR" -lt 10 ]; then
              echo "type=morning" >> $GITHUB_OUTPUT
            else
              echo "type=evening" >> $GITHUB_OUTPUT
            fi
          else
            echo "type=${{ github.event.inputs.batch || 'full' }}" >> $GITHUB_OUTPUT
          fi
          echo "Batch type: $(cat $GITHUB_OUTPUT | grep type)"

      - name: Run Genesis Content Engine
        env:
          # Genesis Studio (Brain Studio API)
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GENESIS_STUDIO_URL: https://genesis-studio-hazel.vercel.app

          # AI APIs
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

          # Facebook Page Tokens
          FB_PAGE_ID_tech_news: ${{ secrets.FB_PAGE_ID_TECH_NEWS }}
          FB_PAGE_TOKEN_tech_news: ${{ secrets.FB_PAGE_TOKEN_TECH_NEWS }}
          FB_PAGE_ID_ai_money: ${{ secrets.FB_PAGE_ID_AI_MONEY }}
          FB_PAGE_TOKEN_ai_money: ${{ secrets.FB_PAGE_TOKEN_AI_MONEY }}
          FB_PAGE_ID_motivation: ${{ secrets.FB_PAGE_ID_MOTIVATION }}
          FB_PAGE_TOKEN_motivation: ${{ secrets.FB_PAGE_TOKEN_MOTIVATION }}
          FB_PAGE_ID_blissful_moments: ${{ secrets.FB_PAGE_ID_BLISSFUL_MOMENTS }}
          FB_PAGE_TOKEN_blissful_moments: ${{ secrets.FB_PAGE_TOKEN_BLISSFUL_MOMENTS }}
        run: |
          BATCH="${{ steps.batch.outputs.type }}"
          echo "========================================"
          echo " Genesis Content Engine — $BATCH batch"
          echo " $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "========================================"

          if [ "$BATCH" = "trends-only" ]; then
            python -u -m genesis.run --phase trends
          elif [ "$BATCH" = "post-only" ]; then
            python -u -m genesis.run --phase post
          else
            # Full pipeline: trends → scripts → videos → watermark → post
            python -u -m genesis.run_full_test
          fi

      - name: Upload pipeline log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genesis-log-${{ steps.batch.outputs.type }}-${{ github.run_number }}
          path: |
            genesis/output/*.mp4
            genesis/logs/*.log
            genesis/genesis.db
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          echo "## Genesis Content Engine Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Batch:** ${{ steps.batch.outputs.type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Count outputs
          VIDEOS=$(ls genesis/output/*branded*.mp4 2>/dev/null | wc -l)
          RAW=$(ls genesis/output/*raw*.mp4 2>/dev/null | wc -l)
          echo "**Videos generated:** $RAW" >> $GITHUB_STEP_SUMMARY
          echo "**Videos branded:** $VIDEOS" >> $GITHUB_STEP_SUMMARY
