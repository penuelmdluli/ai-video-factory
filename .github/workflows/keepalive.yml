name: Keepalive

# Prevents GitHub from auto-disabling the scheduled "Genesis Content Engine"
# workflow. GitHub disables scheduled (cron) workflows after 60 days without
# repository activity — which is exactly what happened (last commit Apr 8 →
# workflow disabled ~Jun 8 → no posts). This job makes a tiny commit every
# ~10 days so the repo always has recent activity, keeping the cron alive.
#
# NOTE: if a scheduled workflow is ALREADY disabled_inactivity, it must be
# re-enabled once by hand (Actions tab → Enable workflow). After that, this
# keepalive stops it from happening again.

on:
  schedule:
    - cron: '0 3 */10 * *'   # 03:00 UTC every ~10 days
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Touch keepalive timestamp
        run: |
          date -u '+%Y-%m-%dT%H:%M:%SZ' > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          # Nothing to commit is fine (e.g. manual runs on the same minute).
          git commit -m "chore: keepalive — keep scheduled workflows active" || exit 0
          git push
